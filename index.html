<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CaloriePilot - Calorie Calculator</title>
</head>

<body>

  <h1>CaloriePilot</h1>

  <h2>Calorie Calculator</h2>

  <p>Calculate your estimated daily calorie needs.</p>

  <label>Age</label>
  <input type="number" id="age">

  <br><br>

  <label>Weight (kg)</label>
  <input type="number" id="weight">

  <br><br>

  <label>Height (cm)</label>
  <input type="number" id="height">

  <br><br>

  <button onclick="calculate()">Calculate Calories</button>

  <h3 id="result"></h3>

<script>

function calculate() {

  let age = Number(document.getElementById("age").value);
  let weight = Number(document.getElementById("weight").value);
  let height = Number(document.getElementById("height").value);

  let bmr = (10 * weight) + (6.25 * height) - (5 * age) + 5;
  let calories = Math.round(bmr * 1.2);

  document.getElementById("result").innerHTML =
    "Estimated maintenance calories: " + calories + " kcal/day";

}

</script>

</body>
</html>
